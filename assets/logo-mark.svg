<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <clipPath id="rg-clip"><rect width="300" height="400" rx="10"/></clipPath>
  <rect width="300" height="400" rx="10" fill="#000"/>
  <!-- ghost -->
  <!-- head is a true circle (r 134), centred between the eyes; right side hides behind the hand -->
  <path d="M11 389 V235 A134 134 0 0 1 279 235 V389 Z" fill="#fff"/>
  <circle cx="128" cy="150" r="8.5" fill="#000"/>
  <circle cx="162" cy="150" r="8.5" fill="#000"/>
  <!-- thumbs-up hand -->
  <g clip-path="url(#rg-clip)" fill="#fff" stroke="#000" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
    <!-- right & bottom edges sit under the frame so the border stays 11 wide on every side -->
    <!-- built from capsules: thumb r≈18; fingers are half-circles (r 34 / 28 / 28.75)
         that taper and recede downward; curves are tangent-continuous, corners only at finger joins -->
    <path d="M293.5 400 V166 A17.75 17.75 0 0 0 258 166 V203 Q258 212 249 212
             H228 C209.2 212 194 227.2 194 246 C194 264.8 209.2 280 228 280
             C212.5 280 200 292.5 200 308 C200 323.5 212.5 336 228 336
             C212.1 336 201 348.9 201 364.75 C201 380.6 212.1 393.5 228 393.5
             H300 V400 Z"/>
    <path d="M228 280 H254 M228 336 H254" fill="none"/>
  </g>
  <!-- window frame -->
  <rect x="5.5" y="5.5" width="289" height="389" rx="6" fill="none" stroke="#000" stroke-width="11"/>
</svg>
